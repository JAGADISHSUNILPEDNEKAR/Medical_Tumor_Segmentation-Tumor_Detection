services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # Phase 6: switch to "pytorch" and mount a checkpoint at MODEL_PATH to run
      # the trained 3D U-Net. Left on "mock" so the stack starts with no model.
      INFERENCE_BACKEND: "${INFERENCE_BACKEND:-mock}"
      MODEL_PATH: "${MODEL_PATH:-}"
      MODEL_VERSION: "${MODEL_VERSION:-}"
      INFERENCE_DEVICE: "${INFERENCE_DEVICE:-auto}"
      INFERENCE_WORKERS: "1"
      MAX_CONCURRENT_JOBS: "1"
      JOB_TIMEOUT_SECONDS: "600"
      UPLOAD_DIR: /data/uploads
      RESULTS_DIR: /data/results
      TEMP_DIR: /data/tmp
      DATABASE_URL: sqlite:////data/app.db
      MAX_UPLOAD_SIZE_MB: "500"
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - app-data:/data
      # Mount the host directory holding best_model.pth read-only, then point
      # MODEL_PATH at /models/best_model.pth.
      - ./models:/models:ro

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ""
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app-data:
